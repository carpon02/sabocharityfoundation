name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test Unit
        # Assuming there is a test:unit script, or fallback to test
        run: npm run test:unit || npm test || echo "No tests configured"
        continue-on-error: true
        env:
          NODE_ENV: test
          JWT_SECRET: "test_secret"
          # Add other necessary env vars for testing here
